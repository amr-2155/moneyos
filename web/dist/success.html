<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="2;url=/app">
  <title>MoneyOS - تم التسجيل بنجاح</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
      background: #0B0F19;
      color: #F9FAFB;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { text-align: center; max-width: 400px; }
    .icon {
      width: 80px; height: 80px;
      background: #2563eb;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #9CA3AF; font-size: 14px; margin-bottom: 12px; line-height: 1.6; }
    .free { color: #F9FAFB; font-weight: 700; }
    .btn {
      display: inline-block;
      background: #2563eb; color: #fff;
      padding: 16px 32px; border-radius: 12px;
      font-size: 16px; font-weight: 700;
      text-decoration: none; margin-top: 12px;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">✓</div>
    <h1>تم التسجيل بنجاح!</h1>
    <p>مرحباً بك في MoneyOS</p>
    <p>سيتم توجيهك إلى التطبيق الآن...</p>
    <p class="free">🤍 مجاني تمامًا لوجه الله</p>
    <a href="/app" class="btn">افتح التطبيق</a>
  </div>
  <script>
    setTimeout(function(){ window.location.replace("/app"); }, 2000);
  </script>
</body>
</html>
